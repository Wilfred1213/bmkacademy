<div class="card shadow-sm border-0">

    <div class="card-body p-4 p-md-5">

        <form
            method="post"
            hx-post="{% url 'admissions:admission_application' %}"
            hx-target="#admission-form-container"
            hx-swap="innerHTML"
        >

            {% csrf_token %}

            <!-- ============================= -->
            <!-- ADMISSION INFORMATION -->
            <!-- ============================= -->

            <h5 class="fw-bold mb-3">
                Admission Information
            </h5>

            <div class="row g-3">

                <!-- Academic Year -->

                <div class="col-md-6">

                    <label class="form-label">
                        Academic Year
                    </label>

                    <select
                        name="academic_year"
                        class="form-select"
                        id="id_academic_year"
                        required
                        hx-get="{% url 'admissions:admission_terms' %}"
                        hx-target="#id_term"
                        hx-trigger="change"
                        hx-swap="innerHTML"
                    >

                        <option value="">
                            Select Academic Year
                        </option>

                        {% for year in academic_years %}

                            <option value="{{ year.id }}">
                                {{ year.name }}
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- Term -->

                <div class="col-md-6">

                    <label class="form-label">
                        Term
                    </label>

                    <select
                        name="term"
                        id="id_term"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select Term
                        </option>

                    </select>

                </div>


                <!-- Desired Class -->

                <div class="col-md-12">

                    <label class="form-label">
                        Desired Class
                    </label>

                    <select
                        name="desired_class"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select Desired Class
                        </option>

                        {% for school_class in school_classes %}

                            <option value="{{ school_class.id }}">
                                {{ school_class.name }}
                            </option>

                        {% endfor %}

                    </select>

                </div>

            </div>


            <hr class="my-4">


            <!-- ============================= -->
            <!-- STUDENT INFORMATION -->
            <!-- ============================= -->

            <h5 class="fw-bold mb-3">
                Student Information
            </h5>

            <div class="row g-3">

                <!-- First Name -->

                <div class="col-md-4">

                    <label class="form-label">
                        First Name
                    </label>

                    <input
                        type="text"
                        name="first_name"
                        class="form-control"
                        placeholder="Enter first name"
                        required
                    >

                </div>


                <!-- Middle Name -->

                <div class="col-md-4">

                    <label class="form-label">
                        Middle Name
                    </label>

                    <input
                        type="text"
                        name="middle_name"
                        class="form-control"
                        placeholder="Enter middle name"
                    >

                </div>


                <!-- Last Name -->

                <div class="col-md-4">

                    <label class="form-label">
                        Last Name
                    </label>

                    <input
                        type="text"
                        name="last_name"
                        class="form-control"
                        placeholder="Enter last name"
                        required
                    >

                </div>


                <!-- Date of Birth -->

                <div class="col-md-6">

                    <label class="form-label">
                        Date of Birth
                    </label>

                    <input
                        type="date"
                        name="date_of_birth"
                        class="form-control"
                        required
                    >

                </div>


                <!-- Gender -->

                <div class="col-md-6">

                    <label class="form-label">
                        Gender
                    </label>

                    <select
                        name="gender"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select Gender
                        </option>

                        <option value="male">
                            Male
                        </option>

                        <option value="female">
                            Female
                        </option>

                    </select>

                </div>


                <!-- Previous School -->

                <div class="col-12">

                    <label class="form-label">
                        Previous School
                    </label>

                    <input
                        type="text"
                        name="previous_school"
                        class="form-control"
                        placeholder="Previous school (optional)"
                    >

                </div>

            </div>


            <hr class="my-4">


            <!-- ============================= -->
            <!-- PARENT / GUARDIAN -->
            <!-- ============================= -->

            <h5 class="fw-bold mb-3">
                Parent / Guardian Information
            </h5>

            <div class="row g-3">

                <!-- Parent Name -->

                <div class="col-md-6">

                    <label class="form-label">
                        Parent / Guardian Name
                    </label>

                    <input
                        type="text"
                        name="parent_name"
                        class="form-control"
                        placeholder="Full name"
                        required
                    >

                </div>


                <!-- Phone -->

                <div class="col-md-6">

                    <label class="form-label">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        name="parent_phone"
                        class="form-control"
                        placeholder="080XXXXXXXX"
                        required
                    >

                </div>


                <!-- Email -->

                <div class="col-md-6">

                    <label class="form-label">
                        Email Address
                    </label>

                    <input
                        type="email"
                        name="parent_email"
                        class="form-control"
                        placeholder="Parent email (optional)"
                    >

                </div>


                <!-- Relationship -->

                <div class="col-md-6">

                    <label class="form-label">
                        Relationship to Student
                    </label>

                    <select
                        name="relationship"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select Relationship
                        </option>

                        <option value="father">
                            Father
                        </option>

                        <option value="mother">
                            Mother
                        </option>

                        <option value="guardian">
                            Guardian
                        </option>

                        <option value="other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- Address -->

                <div class="col-12">

                    <label class="form-label">
                        Residential Address
                    </label>

                    <textarea
                        name="parent_address"
                        class="form-control"
                        rows="3"
                        placeholder="Residential address"
                    ></textarea>

                </div>

            </div>


            <!-- ============================= -->
            <!-- SUBMIT -->
            <!-- ============================= -->

            <div class="d-grid mt-4">

                <button
                    type="submit"
                    class="btn btn-primary btn-lg"
                >
                    Submit Application
                </button>

            </div>

        </form>

    </div>

</div>
