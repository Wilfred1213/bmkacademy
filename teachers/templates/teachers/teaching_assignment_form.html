{% extends "base.html" %}


{% block title %}

    Assign Subject | BMK Academy

{% endblock %}


{% block content %}


<div class="row justify-content-center">

    <div class="col-lg-7">


        <div class="card shadow-sm">

            <div class="card-body p-4">


                <h2 class="mb-1">
                    Assign Subject to Teacher
                </h2>

                <p class="text-muted mb-4">
                    Assign a teacher to a class subject for an academic year.
                </p>


                <form method="post">

                    {% csrf_token %}


                    <!-- Teacher -->

                    <div class="mb-3">

                        <label
                            for="teacher"
                            class="form-label"
                        >
                            Teacher
                        </label>


                        <select
                            name="teacher"
                            id="teacher"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select teacher
                            </option>


                            {% for teacher in teachers %}

                                <option value="{{ teacher.id }}">

                                    {{ teacher.user.get_full_name }}

                                    —
                                    {{ teacher.employee_id }}

                                </option>

                            {% endfor %}

                        </select>

                    </div>


                    <!-- Class Subject -->

                    <div class="mb-3">

                        <label
                            for="class_subject"
                            class="form-label"
                        >
                            Class & Subject
                        </label>


                        <select
                            name="class_subject"
                            id="class_subject"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select class and subject
                            </option>


                            {% for class_subject in class_subjects %}

                                <option
                                    value="{{ class_subject.id }}"
                                >

                                    {{ class_subject.school_class }}

                                    —
                                    {{ class_subject.subject }}

                                </option>

                            {% endfor %}

                        </select>

                    </div>


                    <!-- Academic Year -->

                    <div class="mb-4">

                        <label
                            for="academic_year"
                            class="form-label"
                        >
                            Academic Year
                        </label>


                        <select
                            name="academic_year"
                            id="academic_year"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select academic year
                            </option>


                            {% for academic_year in academic_years %}

                                <option
                                    value="{{ academic_year.id }}"
                                >

                                    {{ academic_year.name }}

                                </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Assign Subject
                        </button>


                        <a
                            href="{% url 'teachers:teaching_assignment_list' %}"
                            class="btn btn-outline-secondary"
                        >
                            Cancel
                        </a>

                    </div>


                </form>


            </div>

        </div>

    </div>

</div>


{% endblock %}
