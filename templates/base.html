{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            BMK Academy
        {% endblock %}
    </title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        @media print {
    
            @page {
                size: A4 portrait;
                margin: 12mm;
            }
    
            body {
                background: white !important;
                font-size: 12px;
            }
    
            .no-print {
                display: none !important;
            }
    
            .print-receipt {
                width: 100%;
                max-width: 180mm;
                margin: 0 auto;
                padding: 0;
            }
    
            .card {
                border: 1px solid #000 !important;
                box-shadow: none !important;
            }
    
            .table {
                font-size: 12px;
            }
    
            .table th,
            .table td {
                padding: 6px 8px !important;
            }
    
            .receipt-header {
                margin-bottom: 12px !important;
            }
    
            h1,
            h2,
            h3,
            h4,
            h5 {
                margin-top: 0 !important;
                margin-bottom: 6px !important;
            }
    
            p {
                margin-bottom: 4px !important;
            }
    
            .receipt-section {
                margin-bottom: 10px !important;
            }
    
            footer {
                display: none !important;
            }
        }
    </style>

</head>


<body>


    <!-- ========================= -->
    <!-- Navigation -->
    <!-- ========================= -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">

        <div class="container">


            <!-- Brand -->

            <a
                class="navbar-brand fw-bold"
                href="#"
            >
                BMK Academy
            </a>


            <!-- Mobile menu button -->

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavigation"
                aria-controls="mainNavigation"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >

                <span class="navbar-toggler-icon"></span>

            </button>


            <!-- Navigation links -->

            <div
                class="collapse navbar-collapse"
                id="mainNavigation"
            >

                <ul class="navbar-nav ms-auto">


                    <!-- Dashboard -->

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="#"
                        >
                            Dashboard
                        </a>

                    </li>


                    <!-- Students -->

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="{% url 'students:student_list' %}"
                        >
                            Students
                        </a>

                    </li>


                    <!-- Attendance -->

                    <li class="nav-item dropdown">

                        <a
                            class="nav-link dropdown-toggle"
                            href="#"
                            role="button"
                            data-bs-toggle="dropdown"
                            aria-expanded="false"
                        >
                            Attendance
                        </a>


                        <ul class="dropdown-menu">


                            <li>

                                <a
                                    class="dropdown-item"
                                    href="{% url 'attendance:mark_attendance' %}"
                                >
                                    Mark Attendance
                                </a>

                            </li>


                            <li>

                                <a
                                    class="dropdown-item"
                                    href="{% url 'attendance:attendance_history' %}"
                                >
                                    Attendance History
                                </a>

                            </li>


                        </ul>

                    </li>


                    <!-- Fees -->

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="{% url 'fees:invoice_list' %}"
                        >
                            Fees
                        </a>

                    </li>


                </ul>

            </div>

        </div>

    </nav>



    <!-- ========================= -->
    <!-- Main Content -->
    <!-- ========================= -->

    <main class="container py-4">

        {% block content %}

        {% endblock %}

    </main>



    <!-- ========================= -->
    <!-- Footer -->
    <!-- ========================= -->

    <footer class="border-top mt-5 py-4">

        <div class="container text-center">

            <p class="mb-1">

                <strong>
                    BMK Academy
                </strong>

            </p>


            <small class="text-muted">

                Nursery & Primary Education

            </small>

        </div>

    </footer>



    <!-- ========================= -->
    <!-- Bootstrap JavaScript -->
    <!-- ========================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


</body>

</html>
